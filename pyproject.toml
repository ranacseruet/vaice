[project]
name = "vaice"
version = "0.1.0"
description = "Voice demo: talk to a local model and hear streamed spoken replies (speech-to-speech model, or Gemma + Kokoro)"
readme = "README.md"
requires-python = ">=3.10,<3.13"  # spaCy (via misaki[en]) has no wheels for 3.13+ yet
dependencies = [
    "fastrtc[vad]",
    "mlx-audio>=0.6.1",  # first version tested with the lfm_audio speech-to-speech model
    "misaki[en]",
    "soundfile",
    "numpy",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
vaice = "vaice.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120  # the house style: code and comments on one line up to ~120 columns

[tool.ruff.lint]
select = ["E4", "E5", "E7", "E9", "F", "B", "I", "UP", "SIM", "BLE", "PERF", "RET", "RUF", "C4"]

[tool.ruff.lint.per-file-ignores]
# tests deliberately catch everything around model/thread fakes to assert what the app shows instead
"tests/*" = ["BLE001"]
