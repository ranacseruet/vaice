[project]
name = "vaice"
version = "0.1.0"
description = "Voice demo: speak to a local Gemma model (llama.cpp) and hear streamed replies via Kokoro TTS"
readme = "README.md"
requires-python = ">=3.10,<3.13"  # spaCy (via misaki[en]) has no wheels for 3.13+ yet
dependencies = [
    "fastrtc[vad]",
    "mlx-audio",
    "misaki[en]",
    "soundfile",
    "numpy",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vaice = "vaice.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
