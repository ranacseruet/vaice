[project]
name = "vaice"
version = "0.1.0"
description = "Voice demo: talk to a local llama-server audio model and hear streamed spoken replies"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"  # the range CI tests; deps also resolve on 3.13/3.14 (checked with uv), not run there
keywords = ["voice", "speech-to-speech", "llama-cpp", "webrtc", "fastrtc", "gradio", "lfm3-audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # interruptible.py and tests/test_interruptible.py are built against fastrtc 0.0.34's internals,
    # so the range admits only patch releases of that line; anything newer goes through a tested
    # uv.lock update (README "Dependency updates").
    "fastrtc[vad]>=0.0.34,<0.1",
    # onnxruntime comes in via fastrtc[vad]; from 1.24 it declares `>=3.10` but only ships cp311+
    # wheels, so Python 3.10 needs an explicit bound on the last cp310 release to stay installable
    # (uv resolves the lock across all supported Pythons at once and would otherwise pick 1.24.x).
    "onnxruntime<1.24; python_version < '3.11'",
    # app.py imports gradio directly; fastrtc 0.0.34 caps it at <6.0 and Gradio 6.0 flips
    # gr.Chatbot(allow_tags) to True, so stay on the tested 5.x line.
    "gradio>=5.50,<6",
    "numpy",
    "scipy>=1.10",  # resamples the mic audio to the llama.cpp model's input rate (audio.py)
    "requests",
    "websockets>=15.0",  # llama-server's /v1/realtime (sync client with recv(timeout) and keep-alive options)
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/ranacseruet/vaice"
Repository = "https://github.com/ranacseruet/vaice"
Issues = "https://github.com/ranacseruet/vaice/issues"
Changelog = "https://github.com/ranacseruet/vaice/blob/main/CHANGELOG.md"

[project.scripts]
vaice = "vaice.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=vaice --cov-report=term-missing"

[tool.ruff]
line-length = 120  # the house style: code and comments on one line up to ~120 columns

[tool.ruff.lint]
select = ["E4", "E5", "E7", "E9", "F", "B", "I", "UP", "SIM", "BLE", "PERF", "RET", "RUF", "C4"]

[tool.ruff.lint.per-file-ignores]
# tests deliberately catch everything around model/thread fakes to assert what the app shows instead
"tests/*" = ["BLE001"]
