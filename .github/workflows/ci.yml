name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]  # README supports 3.10–3.12; 3.12 is the pinned local version
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # locked install from uv.lock; --locked fails the job when the lockfile is out of sync with pyproject.toml
      - run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/pytest -q
